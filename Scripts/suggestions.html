    <!-- MAIN CONTENT -->
    <section class="page-content">

        <div class="container">

            <h2 class="section-title"
                style="color:#D4AF37;">
                BACKEND DEMONSTRATION
            </h2>

            <p style="color:#ccc;
                      margin-bottom:40px;
                      max-width:700px;">

                This form connects to a
                <strong>MySQL Database</strong>
                using <strong>PHP</strong>.

                Any data you enter here is validated,
                processed, and stored in my database for review.

            </p>


            <!-- FORM -->
            <div class="form-container">

                <form action="submit_suggestion.php"
                      method="POST">


                    <div class="form-grid">


                        <!-- FULL NAME -->
                        <div class="form-group">

                            <label for="visitor_name">
                                Full Name
                            </label>

                            <input type="text"
                                   id="visitor_name"
                                   name="visitor_name"
                                   required
                                   placeholder="Enter your name">

                        </div>


                        <!-- DATE OF VISIT -->
                        <div class="form-group">

                            <label for="visit_date">
                                Date of Visit
                            </label>

                            <input type="text"
                                   id="visit_date"
                                   name="visit_date"
                                   readonly
                                   style="background-color:#080808;
                                          color:#888;
                                          cursor:not-allowed;">

                        </div>


                        <!-- EMAIL -->
                        <div class="form-group">

                            <label for="visitor_email">
                                Email Address
                            </label>

                            <input type="email"
                                   id="visitor_email"
                                   name="visitor_email"
                                   required
                                   placeholder="name@example.com">

                        </div>


                        <!-- SUGGESTIONS -->
                        <div class="form-group">

                            <label for="suggestion_text">
                                Suggestions for Me/Website
                            </label>

                            <textarea id="suggestion_text"
                                      name="suggestion_text"
                                      rows="4"
                                      placeholder="How can I improve my portfolio or skills?"></textarea>

                        </div>


                        <!-- JOB OPPORTUNITY -->
                        <div class="form-group">

                            <label for="job_opportunity">
                                Job Opportunity (Optional)
                            </label>

                            <textarea id="job_opportunity"
                                      name="job_opportunity"
                                      rows="3"
                                      placeholder="If you are hiring, let me know the details here..."></textarea>

                        </div>


                        <!-- SUBMIT -->
                        <button type="submit"
                                class="btn-submit">

                            SUBMIT TO DATABASE

                        </button>


                    </div>

                </form>

            </div>

        </div>

    </section>


    <!-- AUTOMATIC DATE -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const dateField =
                document.getElementById("visit_date");

            const today = new Date();

            const day =
                String(today.getDate()).padStart(2, "0");

            const month =
                String(today.getMonth() + 1).padStart(2, "0");

            const year =
                today.getFullYear();

            dateField.value =
                `${day}/${month}/${year}`;

        });
    </script>
