                This form connects to a <strong>MySQL Database</strong> using <strong>PHP</strong>.

            <div class="form-container">

                    <div class="form-group">

                        <textarea name="job_opportunity" rows="3" placeholder="If you are hiring, let me know the details here..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">SUBMIT TO DATABASE</button>

                </form>
            </div>

        </div>

<script>
    const today = new Date();
    const options = { day: 'numeric', month: 'long', year: 'numeric' };
